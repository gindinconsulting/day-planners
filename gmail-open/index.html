1|<!doctype html>
2|<html><head>
3|<meta charset="utf-8">

7|<body style="font-family:-apple-system,system-ui,sans-serif;background:#fff;color:#333;text-align:center;padding:48px 24px">
8|<p id="msg" style="font-size:17px">Opening Gmail…</p>
9|<p id="manual" style="display:none">

13|<script>
14|// Payload rides the fragment: #cv=<threadId>&acc=<appAccountIndex>&u=<webUserIndex>&lab=<Inbox|all>
15|var h = new URLSearchParams(location.hash.slice(1));
16|var id = (h.get('cv') || '').toLowerCase();
17|var acc = h.get('acc') !== null ? h.get('acc') : '0';
18|var u = h.get('u') !== null ? h.get('u') : '0';
19|var lab = h.get('lab') === 'all' ? 'all' : 'Inbox';
20|var web = 'https://mail.google.com/mail/u/' + u + '/#cv/' + lab + '/' + id;
21|var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
22|            (/Mac/.test(navigator.platform) && 'ontouchend' in document);
23|function showManual() {
24|  document.getElementById('msg').textContent = 'Gmail app did not open.';
25|  document.getElementById('weblink').href = web;
26|  document.getElementById('app2').href = 'googlegmail://cv=' + id + '/accountId=' + acc;
27|  document.getElementById('manual').style.display = 'block';
28|}
29|if (!/^[0-9a-f]{10,20}$/.test(id)) {
30|  document.getElementById('msg').textContent = 'No valid Gmail message id in this link.';
31|} else if (!isIOS) {
32|  location.replace(web);
33|} else {
34|  var tries = ['googlegmail://cv=' + id + '/accountId=' + acc,
35|               'googlegmail:///cv=' + id + '/accountId=' + acc];
36|  var i = 0, timer = null;
37|  function next() {
38|    if (i < tries.length) {
39|      location.href = tries[i++];
40|      timer = setTimeout(next, 1200);
41|    } else {
42|      showManual();
43|    }
44|  }
45|  document.addEventListener('visibilitychange', function () {
46|    if (document.hidden && timer) { clearTimeout(timer); timer = null; }
47|  });
48|  next();
49|}
50|</script>
